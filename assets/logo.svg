<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d26"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="seg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4c0ff"/>
      <stop offset="1" stop-color="#6d84ff"/>
