name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Fetch pinned PDFium
        run: node scripts/fetch-pdfium.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI tests (mock backend)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Fetch pinned PDFium
        run: node scripts/fetch-pdfium.mjs
      - name: Core tests on Windows (images and PDFs)
        run: cargo test -p radial-core
      - name: Build installers
        run: npm run tauri build
      - name: Check PDFium is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/pdfium/pdfium.dll)) { throw "pdfium.dll missing from the bundle resources" }
          if (-not (Test-Path target/release/pdfium/LICENSE)) { throw "PDFium licence missing" }
          if (-not (Test-Path target/release/notices/THIRD-PARTY-NOTICES.md)) { throw "Third-party notices missing" }
          if (-not (Test-Path target/release/notices/DejaVu-LICENSE.txt)) { throw "DejaVu licence missing" }
      - name: Check installer contents
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "msi"
          Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$out`"" -Wait
          $files = Get-ChildItem -Recurse $out | ForEach-Object { $_.Name }
          foreach ($f in "radial.exe", "pdfium.dll", "THIRD-PARTY-NOTICES.md", "DejaVu-LICENSE.txt", "LICENSE") {
            if ($files -notcontains $f) { throw "MSI is missing $f" }
          }
          $nsis = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "nsis-install"
          Start-Process $nsis.FullName -ArgumentList "/S", "/D=$dir" -Wait
          foreach ($f in "radial.exe", "pdfium\pdfium.dll", "notices\THIRD-PARTY-NOTICES.md") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "NSIS install is missing $f" }
          }
          Write-Host "MSI and NSIS installers contain the app, PDFium and the notices."
      - name: Self-test the installed app (loads bundled PDFium, runs real conversions)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "nsis-install"
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $p = Start-Process (Join-Path $dir "radial.exe") -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: radial-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
