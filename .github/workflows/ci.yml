name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Fetch pinned PDFium
        run: node scripts/fetch-pdfium.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI tests (mock backend)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Fetch pinned PDFium
        run: node scripts/fetch-pdfium.mjs
      - name: Core tests on Windows (images and PDFs)
        run: cargo test -p radial-core
      - name: Build installers
        run: npm run tauri build
      - name: Check PDFium is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/pdfium/pdfium.dll)) { throw "pdfium.dll missing from the bundle resources" }
          if (-not (Test-Path target/release/pdfium/LICENSE)) { throw "PDFium licence missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: radial-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
