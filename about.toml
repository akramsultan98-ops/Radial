# Licences accepted for dependencies; `cargo about generate` fails on anything else.
# Used to produce THIRD-PARTY-NOTICES.md (see docs/PACKAGING.md).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Our own (unpublished) crates are not third-party notices.
private = { ignore = true }
